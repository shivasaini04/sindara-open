name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  javascript:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run doctor
      - run: npm run new -- SmokeFilm
      - run: npm run typecheck
      - run: npm audit --audit-level=high
  render-and-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s tests
      - run: python scripts/audit_release.py
      - run: npm run stills -- Launch 0 120 240
      - run: npm run stills -- Explainer 0 120 240
      - run: npm run stills -- DataPulse 0 120 240
      - run: npx remotion render src/index.ts Explainer out/smoke.mp4 --frames=0-29 --scale=0.5 --pixel-format=yuv420p --concurrency=2
      - run: python scripts/demo_audio.py
      - run: python scripts/render_and_verify.py --video out/smoke.mp4 --audio public/local/demo.wav --out out/smoke-audio.mp4
      - run: python scripts/qa_lint.py --video out/smoke-audio.mp4 --expect 540x960@30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-smoke
          path: out/
          retention-days: 7
